    <text x="180" y="506" font-size="16" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" fill="#374354">• 点击菜单栏图标展开或收起日历</text>
    <text x="180" y="540" font-size="16" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" fill="#374354">• 支持“回到今天”、月份切换与设置页</text>
